<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>启动台设置</title>
  <link rel="stylesheet" href="../../renderer/remixicon-local.css">
  <style>
    /* Requirement 5: Dark Design */
    :root {
      --bg-color: #080808;
      --panel-bg: #121212;
      --text-color: #e0e0e0;
      --text-muted: #888;
      --accent-color: #2d2d2d;
      --border-color: #333;
      --input-bg: #1a1a1a;
      --hover-bg: #252525;
      --primary-btn: #0066cc;
    }
    body {
      margin: 0; padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: "Microsoft YaHei", sans-serif;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }
    .header {
      padding: 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      display: flex; justify-content: space-between; align-items: center;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .section {
      margin-bottom: 24px;
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }
    .section-title {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      background: var(--input-bg);
      padding: 8px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
    }
    .list-item:hover {
      border-color: var(--border-color);
    }
    .list-item i {
      font-size: 20px;
      color: var(--text-muted);
    }
    .list-item .info {
      flex: 1;
    }
    .list-item .label {
      font-size: 14px;
    }
    .list-item .sub {
      font-size: 11px;
      color: var(--text-muted);
    }
    .list-item .actions {
      display: flex;
      gap: 8px;
    }
    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
    }
    .btn-icon:hover {
      color: #fff;
      background: var(--hover-bg);
    }
    .btn-icon.delete:hover {
      color: #ff6b81;
    }
    
    .footer {
      background: var(--panel-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn {
      padding: 6px 16px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 13px;
      background: var(--accent-color);
      color: white;
    }
    .btn:hover {
      background: var(--hover-bg);
    }
    .btn-primary {
      background: var(--primary-btn);
      border-color: var(--primary-btn);
    }
    .btn-primary:hover {
      background: #005bb5;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--panel-bg);
      width: 400px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
      display: flex; flex-direction: column; gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal.large {
      width: 800px;
      height: 600px;
    }
    .form-group {
      display: flex; flex-direction: column; gap: 6px;
    }
    .form-group label {
      font-size: 12px;
      color: var(--text-muted);
    }
    .form-row {
        display: flex; gap: 8px; align-items: center;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 4px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-btn);
    }
    
    /* Icon Picker Grid */
    .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
        gap: 8px;
        overflow-y: auto;
        flex: 1;
        padding: 4px;
    }
    .icon-cell {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 8px;
        background: var(--input-bg);
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .icon-cell:hover {
        border-color: var(--primary-btn);
        background: var(--hover-bg);
    }
    .icon-cell i { font-size: 24px; margin-bottom: 4px; }
    .icon-cell span { font-size: 10px; color: var(--text-muted); text-align: center; word-break: break-all; }

    /* App List */
    .app-list {
        display: flex; flex-direction: column; gap: 4px;
        overflow-y: auto; flex: 1;
    }
    .app-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px; background: var(--input-bg); border-radius: 4px; cursor: pointer;
    }
    .app-row:hover { background: var(--hover-bg); }
    .app-name { font-size: 13px; }
    .app-path { font-size: 11px; color: var(--text-muted); }

    /* Dynamic Args */
    .arg-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .arg-item { display: flex; gap: 6px; }
    .arg-item button { width: auto; padding: 0 8px; }
  </style>
</head>
<body>
  <div class="header" style="-webkit-app-region: drag;">
      <span>启动台设置</span>
      <button class="btn-icon" style="-webkit-app-region: no-drag;" onclick="window.close()"><i class="ri-close-line"></i></button>
  </div>
  
  <div class="content">
    <div class="section">
      <div class="section-title">
          <span>快捷按钮 (Tools)</span>
          <button class="btn-icon" id="add-btn"><i class="ri-add-line"></i></button>
      </div>
      <div class="item-list" id="list-buttons"></div>
    </div>
    
    <div class="section">
      <div class="section-title">
          <span>桌面应用 (Apps)</span>
          <button class="btn-icon" id="add-app"><i class="ri-add-line"></i></button>
      </div>
      <div class="item-list" id="list-apps"></div>
    </div>
  </div>

  <div class="footer">
    <button class="btn" onclick="window.close()">取消</button>
    <button class="btn btn-primary" id="btn-save">保存并应用</button>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h3 style="margin:0;font-size:16px;" id="modal-title">编辑</h3>
      
      <div class="form-group">
        <label>名称</label>
        <input type="text" id="inp-label" placeholder="显示名称">
      </div>
      
      <div class="form-group">
        <label>图标</label>
        <div class="form-row">
            <input type="text" id="inp-icon" placeholder="ri-xx-line">
            <button class="btn" id="btn-pick-icon"><i class="ri-search-line"></i></button>
        </div>
      </div>
      
      <!-- Button Specific -->
      <div id="type-button-fields" style="display:none">
        <div class="form-group">
          <label>动作类型</label>
          <select id="inp-action-type">
            <option value="plugin">插件调用 (Plugin)</option>
            <option value="app">打开应用 (App)</option>
            <option value="key">模拟按键 (Key)</option>
            <option value="openSettings">打开编辑 (Settings)</option>
            <option value="udisk">打开U盘列表 (U-Disk)</option>
          </select>
        </div>

        <!-- Dynamic Payload Fields -->
        <div id="payload-container" style="margin-top:8px; display:flex; flex-direction:column; gap:8px;">
            <!-- Generated by JS -->
        </div>
      </div>

      <!-- App Specific -->
      <div id="type-app-fields" style="display:none">
        <div class="form-group">
          <label>应用路径</label>
          <div class="form-row">
            <input type="text" id="inp-path" placeholder="C:\Program Files\...">
            <button class="btn" id="btn-pick-app">选择...</button>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
        <button class="btn" onclick="closeModal('edit-modal')">取消</button>
        <button class="btn btn-primary" onclick="confirmEdit()">确定</button>
      </div>
    </div>
  </div>

  <!-- Icon Picker Modal -->
  <div class="modal-overlay" id="icon-modal">
      <div class="modal large">
          <div class="header" style="padding:0;border:none;background:none;margin-bottom:12px;">
              <span>选择图标</span>
              <button class="btn-icon" onclick="closeModal('icon-modal')"><i class="ri-close-line"></i></button>
          </div>
          <input type="text" id="icon-search" placeholder="搜索图标..." style="margin-bottom:8px;">
          <div class="icon-grid" id="icon-grid"></div>
      </div>
  </div>

  <!-- App Selector Modal -->
  <div class="modal-overlay" id="app-modal">
      <div class="modal large">
          <div class="header" style="padding:0;border:none;background:none;margin-bottom:12px;">
              <span>选择应用程序</span>
              <button class="btn-icon" onclick="closeModal('app-modal')"><i class="ri-close-line"></i></button>
          </div>
          <input type="text" id="app-search" placeholder="搜索程序..." style="margin-bottom:8px;">
          <div class="app-list" id="app-list"></div>
      </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const PLUGIN_ID = 'desktop-launcher';
    
    let config = { buttons: [], apps: [] };
    let editingType = null;
    let editingIndex = -1;
    let cachedPlugins = [];
    let cachedApps = [];

    // Common Icons
    const COMMON_ICONS = [
        'ri-apps-2-line', 'ri-home-line', 'ri-settings-3-line', 'ri-search-line',
        'ri-star-line', 'ri-heart-line', 'ri-user-line', 'ri-file-line',
        'ri-folder-line', 'ri-image-line', 'ri-music-line', 'ri-video-line',
        'ri-camera-line', 'ri-download-line', 'ri-upload-line', 'ri-share-line',
        'ri-delete-bin-line', 'ri-lock-line', 'ri-shield-line', 'ri-key-line',
        'ri-timer-line', 'ri-alarm-line', 'ri-calendar-line', 'ri-map-pin-line',
        'ri-compass-3-line', 'ri-flight-takeoff-line', 'ri-car-line', 'ri-bus-line',
        'ri-mail-line', 'ri-chat-1-line', 'ri-phone-line', 'ri-wifi-line',
        'ri-battery-charge-line', 'ri-cpu-line', 'ri-database-2-line', 'ri-code-line',
        'ri-terminal-line', 'ri-bug-line', 'ri-git-branch-line', 'ri-chrome-line',
        'ri-edge-line', 'ri-firefox-line', 'ri-ie-line', 'ri-safari-line',
        'ri-windows-line', 'ri-apple-line', 'ri-android-line', 'ri-ubuntu-line'
    ];

    async function init() {
        await loadConfig();
        // Pre-fetch plugins for dropdown
        try {
            const res = await ipcRenderer.invoke('plugin:call', 'screen-compass', 'listPlugins', []);
            if (Array.isArray(res)) {
                cachedPlugins = res;
            } else if (res && Array.isArray(res.result)) {
                cachedPlugins = res.result;
            } else {
                cachedPlugins = [];
            }
        } catch(e) { console.error(e); cachedPlugins = []; }
    }

    async function loadConfig() {
      try {
        const res = await ipcRenderer.invoke('config:plugin:getAll', PLUGIN_ID);
        if (res) {
          if (res.buttons) config.buttons = res.buttons;
          if (res.apps) config.apps = res.apps;
        }
        // Defaults if empty
        if (!config.buttons.length && !config.apps.length) {
            config.buttons = [
                { label: '计时', icon: 'ri-timer-line', actionType: 'plugin', actionPayload: { pluginId: 'clock-timer', fn: 'openTimer' } },
                { label: 'U盘', icon: 'ri-usb-line', actionType: 'key', actionPayload: { key: 'u-disk' } }
            ];
            config.apps = [
                { label: '希沃白板 5', icon: 'ri-artboard-line', path: '' },
                { label: 'Microsoft Edge', icon: 'ri-ie-line', path: '' }
            ];
        }
        render();
      } catch (e) {
        console.error('Load config failed', e);
      }
    }

    function render() {
      const btnList = document.getElementById('list-buttons');
      btnList.innerHTML = '';
      config.buttons.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        let iconHtml = '';
        const ic = item.icon || '';
        if (ic.startsWith('data:') || ic.startsWith('http') || ic.includes('/') || ic.includes('\\')) {
            iconHtml = `<img src="${ic}" style="width:20px;height:20px;object-fit:contain;">`;
        } else {
            iconHtml = `<i class="${ic}"></i>`;
        }
        div.innerHTML = `
          ${iconHtml}
          <div class="info">
            <div class="label">${item.label}</div>
            <div class="sub">${getActionDesc(item)}</div>
          </div>
          <div class="actions">
            <button class="btn-icon" onclick="editItem('button', ${idx})"><i class="ri-pencil-line"></i></button>
            <button class="btn-icon delete" onclick="deleteItem('button', ${idx})"><i class="ri-delete-bin-line"></i></button>
          </div>
        `;
        btnList.appendChild(div);
      });

      const appList = document.getElementById('list-apps');
      appList.innerHTML = '';
      config.apps.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        let iconHtml = '';
        const ic = item.icon || '';
        if (ic.startsWith('data:') || ic.startsWith('http') || ic.includes('/') || ic.includes('\\')) {
            iconHtml = `<img src="${ic}" style="width:20px;height:20px;object-fit:contain;">`;
        } else {
            iconHtml = `<i class="${ic}"></i>`;
        }
        div.innerHTML = `
          ${iconHtml}
          <div class="info">
            <div class="label">${item.label}</div>
            <div class="sub">${item.path || '未设置路径'}</div>
          </div>
          <div class="actions">
            <button class="btn-icon" onclick="editItem('app', ${idx})"><i class="ri-pencil-line"></i></button>
            <button class="btn-icon delete" onclick="deleteItem('app', ${idx})"><i class="ri-delete-bin-line"></i></button>
          </div>
        `;
        appList.appendChild(div);
      });
    }

    function getActionDesc(item) {
        if (item.actionType === 'plugin') {
            return `插件: ${item.actionPayload?.pluginId} / ${item.actionPayload?.fn}`;
        } else if (item.actionType === 'openSettings') {
            return '打开编辑模式';
        }
        return item.actionType;
    }

    window.editItem = (type, idx) => {
      editingType = type;
      editingIndex = idx;
      let item = {};
      if (idx >= 0) {
        item = type === 'button' ? config.buttons[idx] : config.apps[idx];
      } else {
        // Default for new item
        if (type === 'button') {
            item = { label: '新按钮', icon: 'ri-star-line', actionType: 'plugin', actionPayload: {} };
        } else {
            item = { label: '新应用', icon: 'ri-app-store-line', path: '' };
        }
      }
      
      document.getElementById('modal-title').innerText = idx >= 0 ? '编辑' : (type==='button'?'添加按钮':'添加应用');
      document.getElementById('inp-label').value = item.label || '';
      document.getElementById('inp-icon').value = item.icon || '';
      
      if (type === 'button') {
        document.getElementById('type-button-fields').style.display = 'block';
        document.getElementById('type-app-fields').style.display = 'none';
        const at = item.actionType || 'plugin';
        document.getElementById('inp-action-type').value = at;
        renderPayloadFields(at, item.actionPayload || {});
      } else {
        document.getElementById('type-button-fields').style.display = 'none';
        document.getElementById('type-app-fields').style.display = 'block';
        document.getElementById('inp-path').value = item.path || '';
      }
      
      document.getElementById('edit-modal').style.display = 'flex';
    };

    window.deleteItem = (type, idx) => {
      if (confirm('确定删除?')) {
        if (type === 'button') config.buttons.splice(idx, 1);
        else config.apps.splice(idx, 1);
        render();
      }
    };

    document.getElementById('add-btn').onclick = () => {
        window.editItem('button', -1);
    };

    document.getElementById('add-app').onclick = () => {
        window.editItem('app', -1);
    };

    document.getElementById('inp-action-type').onchange = (e) => {
        renderPayloadFields(e.target.value, {});
    };

    function renderPayloadFields(type, payload) {
        const container = document.getElementById('payload-container');
        container.innerHTML = '';
        
        if (type === 'plugin') {
            // Plugin Select
            const row1 = document.createElement('div');
            row1.className = 'form-group';
            row1.innerHTML = `<label>插件 (Plugin ID)</label><select id="pl-plugin-id"></select>`;
            container.appendChild(row1);
            
            const sel = row1.querySelector('select');
            // Empty Option
            const emptyOpt = document.createElement('option');
            emptyOpt.value = ''; emptyOpt.text = '请选择插件...';
            sel.appendChild(emptyOpt);

            cachedPlugins.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.text = p.name || p.id;
                sel.appendChild(opt);
            });
            // Add custom if not in list
            if (payload.pluginId && !cachedPlugins.find(p=>p.id===payload.pluginId)) {
                 const opt = document.createElement('option');
                 opt.value = payload.pluginId;
                 opt.text = payload.pluginId;
                 sel.appendChild(opt);
            }
            sel.value = payload.pluginId || '';
            
            // Action Select (Replaces Function Input)
            const row2 = document.createElement('div');
            row2.className = 'form-group';
            row2.innerHTML = `<label>动作 (Action)</label><select id="pl-action"></select>`;
            container.appendChild(row2);
            
            // Manual Input fallback
            const rowManual = document.createElement('div');
            rowManual.className = 'form-group';
            rowManual.style.display = 'none'; // Hidden by default
            rowManual.innerHTML = `<input type="text" id="pl-fn" value="${payload.fn || ''}" placeholder="输入函数名...">`;
            container.appendChild(rowManual);

            const actSel = row2.querySelector('select');
            
            const updateActions = (pid) => {
                actSel.innerHTML = '';
                const p = cachedPlugins.find(v => v.id === pid);
                if (p && Array.isArray(p.actions)) {
                    p.actions.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.target || a.id; // Some plugins use 'target', some 'id' for function name
                        opt.text = a.text || a.id;
                        actSel.appendChild(opt);
                    });
                }
                // Custom/Manual input option?
                const manualOpt = document.createElement('option');
                manualOpt.value = '__manual__'; manualOpt.text = '手动输入...';
                actSel.appendChild(manualOpt);
                
                // Select current if exists
                if (payload.fn) {
                    const exists = Array.from(actSel.options).some(o => o.value === payload.fn);
                    if (exists) actSel.value = payload.fn;
                    else {
                         // Add as manual entry
                         const opt = document.createElement('option');
                         opt.value = payload.fn; opt.text = payload.fn;
                         actSel.insertBefore(opt, manualOpt);
                         actSel.value = payload.fn;
                    }
                }

                // Force update manual input if not manual mode
                if (actSel.value !== '__manual__') {
                    rowManual.style.display = 'none';
                    document.getElementById('pl-fn').value = actSel.value;
                } else {
                    rowManual.style.display = 'block';
                }
            };
            
            sel.onchange = () => updateActions(sel.value);
            if (sel.value) updateActions(sel.value);
            
            actSel.onchange = () => {
                if (actSel.value === '__manual__') {
                    rowManual.style.display = 'block';
                    document.getElementById('pl-fn').focus();
                } else {
                    rowManual.style.display = 'none';
                    document.getElementById('pl-fn').value = actSel.value;
                }
            };

            // Args (Simple JSON for now or list)
            // Let's use simple JSON for flexibility as arguments can be complex
            const row3 = document.createElement('div');
            row3.className = 'form-group';
            row3.innerHTML = `<label>参数 (JSON Array)</label><textarea id="pl-args" rows="3">${JSON.stringify(payload.args || [], null, 2)}</textarea>`;
            container.appendChild(row3);
        } else if (type === 'openSettings') {
            // No payload needed usually
            container.innerHTML = '<div style="color:#888;font-size:12px;">此操作将打开启动台设置窗口。</div>';
        } else if (type === 'app') {
             const row = document.createElement('div');
             row.className = 'form-group';
             row.innerHTML = `<label>应用路径</label><div class="form-row"><input type="text" id="pl-path" value="${payload.path || ''}"><button class="btn" style="white-space:nowrap;" onclick="openAppSelectorLazy(this.previousElementSibling)">选择</button></div>`;
             container.appendChild(row);
        } else if (type === 'key') {
             const row = document.createElement('div');
             row.className = 'form-group';
             row.innerHTML = `<label>按键 (Key)</label><input type="text" id="pl-key" value="${payload.key || ''}">`;
             container.appendChild(row);
        }
    }

    window.closeModal = (id) => {
      document.getElementById(id).style.display = 'none';
    };

    window.confirmEdit = () => {
      const label = document.getElementById('inp-label').value;
      const icon = document.getElementById('inp-icon').value;
      
      let newItem = { label, icon };
      
      if (editingType === 'button') {
        newItem.actionType = document.getElementById('inp-action-type').value;
        newItem.actionPayload = {};
        
        if (newItem.actionType === 'plugin') {
            newItem.actionPayload = {
                pluginId: document.getElementById('pl-plugin-id').value,
                fn: document.getElementById('pl-fn').value,
                args: []
            };
            try {
                newItem.actionPayload.args = JSON.parse(document.getElementById('pl-args').value);
            } catch(e) {}
        } else if (newItem.actionType === 'app') {
            newItem.actionPayload = { path: document.getElementById('pl-path').value };
        } else if (newItem.actionType === 'key') {
            newItem.actionPayload = { key: document.getElementById('pl-key').value };
        } else if (newItem.actionType === 'openSettings') {
             // No payload
        }
        
        if (editingIndex === -1) config.buttons.push(newItem);
        else config.buttons[editingIndex] = newItem;
      } else {
        newItem.path = document.getElementById('inp-path').value;
        if (editingIndex === -1) config.apps.push(newItem);
        else config.apps[editingIndex] = newItem;
      }
      
      render();
      closeModal('edit-modal');
    };

    document.getElementById('btn-save').onclick = async () => {
      try {
        await ipcRenderer.invoke('config:plugin:set', PLUGIN_ID, 'buttons', config.buttons);
        await ipcRenderer.invoke('config:plugin:set', PLUGIN_ID, 'apps', config.apps);
        await ipcRenderer.invoke('plugin:event:emit', 'desktop-launcher:config-changed', config);
        alert('保存成功');
      } catch (e) {
        alert('保存失败: ' + e.message);
      }
    };

    // --- Icon Picker ---
    document.getElementById('btn-pick-icon').onclick = () => {
        const grid = document.getElementById('icon-grid');
        grid.innerHTML = '';
        const search = document.getElementById('icon-search');
        
        const renderIcons = (filter) => {
            grid.innerHTML = '';
            COMMON_ICONS.forEach(ic => {
                if (filter && !ic.includes(filter)) return;
                const cell = document.createElement('div');
                cell.className = 'icon-cell';
                cell.innerHTML = `<i class="${ic}"></i><span>${ic.replace('ri-','').replace('-line','')}</span>`;
                cell.onclick = () => {
                    document.getElementById('inp-icon').value = ic;
                    closeModal('icon-modal');
                };
                grid.appendChild(cell);
            });
        };
        
        search.oninput = (e) => renderIcons(e.target.value.toLowerCase());
        renderIcons('');
        document.getElementById('icon-modal').style.display = 'flex';
    };

    // --- App Selector ---
    document.getElementById('btn-pick-app').onclick = () => {
        openAppSelectorLazy(document.getElementById('inp-path'));
    };

    window.openAppSelectorLazy = async (targetInput) => {
        const modal = document.getElementById('app-modal');
        const list = document.getElementById('app-list');
        const search = document.getElementById('app-search');
        list.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">加载中...</div>';
        modal.style.display = 'flex';

        try {
            if (cachedApps.length === 0) {
                 const res = await ipcRenderer.invoke('plugin:call', 'screen-compass', 'listInstalledApps', []);
                 // If call fails or returns non-array, handle it
                 if (Array.isArray(res)) {
                    cachedApps = res;
                 } else if (res && Array.isArray(res.result)) {
                    cachedApps = res.result;
                 } else {
                    cachedApps = [];
                 }
            }
            
            const renderApps = (filter) => {
                list.innerHTML = '';
                cachedApps.forEach(app => {
                    if (filter) {
                        if (!app.name.toLowerCase().includes(filter) && !app.path.toLowerCase().includes(filter)) return;
                    }
                    const row = document.createElement('div');
                    row.className = 'app-row';
                    row.innerHTML = `<div class="app-name">${app.name}</div><div class="app-path">${app.path}</div>`;
                    row.onclick = async () => {
                        if (targetInput) targetInput.value = app.path;
                        closeModal('app-modal');
                        
                        // Auto-fill label and icon if editing app or button
                        try {
                             const res = await ipcRenderer.invoke('desktop-widgets:call-plugin', {
                                 pluginId: PLUGIN_ID,
                                 fn: 'getFileIconDataUrl',
                                 args: [app.path]
                             });
                             
                             let iconUrl = '';
                             if (typeof res === 'string') iconUrl = res;
                             else if (res && typeof res.result === 'string') iconUrl = res.result;
                             // Some plugins might return { ok: true, data: ... } or similar, but desktop-launcher index.js returns string directly? 
                             // Wait, index.js returns `img.toDataURL()` which is string.
                             // BUT desktop-widgets:call-plugin wraps the result?
                             // Let's check desktop-widgets/index.js if possible, or assume it might be wrapped.
                             // Usually `call-plugin` returns the direct result of the function if it's via `ipcMain.handle` directly?
                             // No, `desktop-widgets` plugin handles `call-plugin`.
                             // If desktop-widgets `call-plugin` just delegates, it might return what the function returns.
                             // However, if the user sees `[object Object]`, it means `res` is an object.
                             // So it's likely `{ ok: true, result: ... }` or similar wrapper from the bridge?
                             // Or `desktop-launcher`'s `getFileIconDataUrl` function itself returns a string? Yes.
                             // So `res` is the object wrapper.
                             
                             if (!iconUrl && res && res.result) iconUrl = res.result;
                             
                             if (iconUrl) {
                                 const iconInp = document.getElementById('inp-icon');
                                 if (iconInp) iconInp.value = iconUrl;
                             }
                             
                             const labelInp = document.getElementById('inp-label');
                             if (labelInp) labelInp.value = app.name;
                        } catch(e) { console.error('Get icon failed', e); }
                    };
                    list.appendChild(row);
                });
            };

            search.oninput = (e) => renderApps(e.target.value.toLowerCase());
            renderApps('');

        } catch(e) {
            list.innerHTML = `<div style="padding:20px;text-align:center;color:red;">加载失败: ${e.message}</div>`;
        }
    };

    init();
  </script>
</body>
</html>
