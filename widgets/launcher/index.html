<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Launcher</title>
  <!-- Use local asset path -->
  <link rel="stylesheet" href="../../../../renderer/remixicon-local.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" id="main-container">
    <!-- Top Section: Quick Tools -->
    <div class="section-tools" id="tools-container">
      <!-- Generated by JS -->
    </div>

    <!-- Middle Section: Desktop Apps -->
    <div class="section-apps">
      <div class="section-title">桌面应用</div>
      <div class="apps-grid" id="apps-container">
        <!-- Generated by JS -->
      </div>
    </div>

    <!-- Bottom Section: Action Bar -->
    <div class="action-bar">
      <button class="btn-dismiss" id="btn-dismiss">一键下课</button>
      <div class="action-tools">
        <!-- Edit button calls external settings window -->
        <button class="icon-btn" id="btn-power" title="电源"><i class="ri-shut-down-line"></i></button>
        <button class="icon-btn" id="btn-edit" title="设置"><i class="ri-settings-3-line"></i></button>
      </div>
    </div>
  </div>

  <!-- U-Disk View Container (Hidden by default) -->
  <div class="container" id="udisk-container" style="display:none; background: #1a1a1a;">
      <div class="udisk-header">
          <button class="btn-back" id="btn-udisk-back"><i class="ri-arrow-left-line"></i> 返回</button>
          <div class="header-title">U盘列表</div>
      </div>
      <div class="udisk-list" id="udisk-list">
          <!-- Generated by JS -->
      </div>
      <!-- Bottom bar for consistency or remove? Keep same bottom bar -->
      <div class="action-bar">
        <button class="btn-dismiss" style="visibility:hidden">Placeholder</button>
        <div class="action-tools">
           <button class="icon-btn" id="btn-power-2" title="电源"><i class="ri-shut-down-line"></i></button>
        </div>
      </div>
  </div>

  <!-- Power Menu Overlay -->
  <div class="power-menu" id="power-menu" style="display:none;">
      <button class="power-item" id="pm-shutdown"><i class="ri-shut-down-line"></i> 关机</button>
      <button class="power-item" id="pm-restart"><i class="ri-restart-line"></i> 重启</button>
      <button class="power-item cancel" id="pm-cancel">取消</button>
  </div>
  
  <script src="index.js"></script>
</body>
</html>
